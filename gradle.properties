#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Lukia
# The version the app calls itself, and the one a diagnostic report names. Read
# by the Android and desktop builds and written into common code as
# `LukiaVersion`, so there is one place to change it rather than three that
# quietly disagree - which is how this came to read 1.0 on two platforms and
# 1.0.0 on the third. iOS reads its own copy from Config.xcconfig, which is
# outside Gradle's reach and has to be changed alongside this.
lukia.version=1.1.0

# What Play orders uploads by. Deliberately not derived from the version above:
# the same version is uploaded more than once after a rejected release, and Play
# refuses a code it has already seen - so this rises on its own, every upload.
lukia.versionCode=3
