name: Dependency graph

# A Gradle project has no dependency graph on GitHub until something submits
# one, and Dependabot's vulnerability alerts read that graph. Without this the
# alerts are silent - not because there is nothing wrong, but because GitHub
# cannot see past libs.versions.toml into what those versions actually pull in.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dependency-graph
  cancel-in-progress: true

jobs:
  submit:
    name: Submit the resolved dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
