name: Dependency graph

# A Gradle project has no dependency graph on GitHub until something submits
# one, and Dependabot's vulnerability alerts read that graph. Without this the
# alerts are silent - not because there is nothing wrong, but because GitHub
# cannot see past libs.versions.toml into what those versions actually pull in.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dependency-graph
  cancel-in-progress: true

jobs:
  submit:
    name: Submit the resolved dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
