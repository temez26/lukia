name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel a release half-built.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Tag matches every version file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Config.xcconfig is outside Gradle's reach and kept in step by hand, so
      # this is the only thing standing between it and silent drift.
      - name: Compare tag, gradle.properties and Config.xcconfig
        run: |
          tag="${GITHUB_REF_NAME#v}"
          gradle_version="$(sed -n 's/^lukia\.version=//p' gradle.properties)"
          ios_version="$(sed -n 's/^MARKETING_VERSION=//p' iosApp/Configuration/Config.xcconfig)"
          echo "tag=$tag  gradle.properties=$gradle_version  Config.xcconfig=$ios_version"
          if [ "$tag" != "$gradle_version" ]; then
            echo "::error::tag $tag does not match lukia.version $gradle_version"
            exit 1
          fi
          if [ "$tag" != "$ios_version" ]; then
            echo "::error::tag $tag does not match MARKETING_VERSION $ios_version"
            exit 1
          fi

  android:
    name: Signed app bundle
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true

      - name: Decode the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:bundleRelease

      - name: Shred the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-bundle
          path: androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Kept as a build artifact rather than attached to the release: it is what
      # turns an obfuscated crash note back into a readable one, and it is nobody
      # else's business. See DIAGNOSTICS.md.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-mapping
          path: androidApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

  desktop:
    name: Desktop ${{ matrix.format }}
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            task: packageDmg
            format: dmg
          - os: windows-latest
            task: packageMsi
            format: msi
          - os: ubuntu-latest
            task: packageDeb
            format: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true

      - name: Package
        run: ./gradlew :desktopApp:${{ matrix.task }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.format }}
          path: desktopApp/build/compose/binaries/main/${{ matrix.format }}/*
          if-no-files-found: error

  publish:
    name: Draft the release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The mapping is deliberately not among these - it is not downloaded.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: '{android-bundle,desktop-*}'
          merge-multiple: true

      - name: What was built
        run: ls -lhR artifacts

      # A draft, so the installers can be tried before anyone is offered them.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.aab
            artifacts/*.dmg
            artifacts/*.msi
            artifacts/*.deb
