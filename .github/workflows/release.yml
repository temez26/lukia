name: Release

on:
  push:
    tags: ['v*']
  # Build the whole thing on demand without releasing it, so the machinery is
  # known to work before there is any reason to rely on it. A run started this
  # way stops after the artifacts - see the publish job.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release half-built.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Tag matches every version file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Config.xcconfig is outside Gradle's reach and kept in step by hand, so
      # this is the only thing standing between it and silent drift.
      - name: Compare tag, gradle.properties and Config.xcconfig
        run: |
          gradle_version="$(sed -n 's/^lukia\.version=//p' gradle.properties)"
          ios_version="$(sed -n 's/^MARKETING_VERSION=//p' iosApp/Configuration/Config.xcconfig)"
          echo "gradle.properties=$gradle_version  Config.xcconfig=$ios_version"
          if [ "$gradle_version" != "$ios_version" ]; then
            echo "::error::lukia.version $gradle_version does not match MARKETING_VERSION $ios_version"
            exit 1
          fi
          # A run started by hand has no tag to agree with; the two files above
          # still have to agree with each other.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag=$tag"
            if [ "$tag" != "$gradle_version" ]; then
              echo "::error::tag $tag does not match lukia.version $gradle_version"
              exit 1
            fi
          fi

  android:
    name: Signed app bundle and APK
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # Absent before there is anything to sign for. A rehearsal without the
      # secret builds an unsigned bundle, which is enough to prove the release
      # builds; a tag without it is a mistake and stops here.
      - name: Decode the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set - $GITHUB_REF_NAME would release an unsigned bundle"
              exit 1
            fi
            echo "::warning::No keystore secret. Building unsigned - a rehearsal, not a release."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # ANDROID_KEYSTORE_PATH arrives from the step above, and only if it wrote
      # a keystore - which is what leaves the build unsigned rather than broken.
      # The bundle is what a store takes; the APK is what installs directly.
      - name: Bundle and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:bundleRelease :androidApp:assembleRelease

      - name: Shred the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-bundle
          path: androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Kept as a build artifact rather than attached to the release: it is what
      # turns an obfuscated crash note back into a readable one, and it is nobody
      # else's business. See docs/DIAGNOSTICS.md.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-mapping
          path: androidApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

  desktop:
    name: Desktop ${{ matrix.format }}
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            task: packageDmg
            format: dmg
          - os: windows-latest
            task: packageMsi
            format: msi
          - os: ubuntu-latest
            task: packageDeb
            format: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Package
        run: ./gradlew :desktopApp:${{ matrix.task }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.format }}
          path: desktopApp/build/compose/binaries/main/${{ matrix.format }}/*
          if-no-files-found: error

  server-image:
    name: Server image
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # The image packages a distribution Gradle built - see server/Dockerfile
      # for why it is not built inside the image.
      - name: Build the distribution
        run: ./gradlew :server:installDist

      # Tagged with the version and with `latest`, so a server can be pinned to
      # a release or follow them. Pushed only for a tag: a run started by hand
      # proves the image builds and stops there, as the publish job does.
      - name: Build and publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(sed -n 's/^lukia\.version=//p' gradle.properties)"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lukia-server"
          docker build -t "$image:$version" -t "$image:latest" server
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker push "$image:$version"
            docker push "$image:latest"
          fi

  publish:
    name: Draft the release
    needs: [android, desktop]
    # Only a tag publishes. A run started by hand has done its job by now: it
    # has proved the release builds, and left the artifacts to prove it.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The mapping is deliberately not among these - it is not downloaded.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: '{android-bundle,android-apk,desktop-*}'
          merge-multiple: true

      - name: What was built
        run: ls -lhR artifacts

      # A draft, so the installers can be tried before anyone is offered them.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.aab
            artifacts/*.apk
            artifacts/*.dmg
            artifacts/*.msi
            artifacts/*.deb
