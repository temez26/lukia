# Overrides on top of detekt's default rule set (`buildUponDefaultConfig = true`).
# Only rules that differ from the defaults are listed here.
#
# Division of labour: detekt owns structural rules (size, complexity, correctness,
# Compose usage); ktlint owns formatting and imports, configured in `.editorconfig`.
# Rules that ktlint already covers are switched off here so a single problem is not
# reported twice.

# Which source sets are tests.
#
# detekt ships a test-exclude list on the rules that are only meaningful about
# production code, but it was written for a JVM or Android layout: it names
# `commonTest`, `jvmTest` and `iosTest` and knows nothing of this project's
# `androidDeviceTest`, so a rule silenced everywhere else fired there alone.
# Declared once and referenced by each rule that needs it, so the next source set
# is added in one place. Not a rule set, which is why validation is told to
# expect it.
testSources: &testSources
  - '**/commonTest/**'
  - '**/jvmTest/**'
  - '**/iosTest/**'
  - '**/androidDeviceTest/**'
  - '**/androidHostTest/**'
  # `:server` is a plain JVM module, whose tests sit in Gradle's default layout.
  - '**/src/test/**'
  # Fixtures for other modules' tests, which only live in a main source set
  # because Kotlin Multiplatform has nowhere else to share them from.
  - '**/formats-testing/**'
  - '**/*.kts'

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false
  excludes: 'testSources'

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false
  OutdatedDocumentation:
    active: true
    # A test helper's KDoc explains what the fixture is for; it is not the public
    # API contract this rule is checking.
    excludes: *testSources

complexity:
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    ignoreSingleWhenExpression: true
  LargeClass:
    active: true
    threshold: 400
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    # A composable's optional parameters are its configuration surface, not the
    # argument list a caller has to reckon with, so only required ones count.
    ignoreDefaultParameters: true
    # A composable's parameters are its API: a screen section legitimately takes
    # more than a plain function does, and detekt cannot hold the two to
    # different numbers. Composables are held to eight in review instead - see
    # docs/CODING_STYLE.md - so that splitting a long screen does not have to trade a
    # long file for several long signatures.
    ignoreAnnotated: ['Composable']
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    active: true
    thresholdInFiles: 25
    thresholdInClasses: 20
    thresholdInInterfaces: 20
    thresholdInObjects: 20
    ignorePrivate: true
    ignoreOverridden: true
  NamedArguments:
    active: true
    threshold: 4
    ignoreArgumentsMatchingNames: true

coroutines:
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true
  RedundantSuspendModifier:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

exceptions:
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  TooGenericExceptionCaught:
    active: true
  TooGenericExceptionThrown:
    active: true
    # detekt excludes test sources from TooGenericExceptionCaught and not from
    # this one, which is an oversight in its defaults rather than a distinction.
    # A fake that throws is not the app failing to model a failure - it is a test
    # saying "and then the network was not there", and the type it throws is
    # never caught by type. See the note above `naming` for the source-set list.
    excludes: *testSources

naming:
  FunctionNaming:
    active: true
    # Composables are PascalCase; they name a piece of UI, not an action.
    ignoreAnnotated: ['Composable']
  # A file may group several related composables or extensions, so its name is not
  # required to match one declaration inside it.
  MatchingDeclarationName:
    active: false
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Za-z0-9]*'
    privatePropertyPattern: '_?[A-Za-z][_A-Za-z0-9]*'

performance:
  SpreadOperator:
    active: true
  UnnecessaryPartOfBinaryExpression:
    active: true

potential-bugs:
  CastToNullableType:
    active: true
  DontDowncastCollectionTypes:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
  ExitOutsideMain:
    active: true
  ImplicitUnitReturnType:
    active: true
  UnnecessaryNotNullCheck:
    active: true
  UnsafeCallOnNullableType:
    active: true

style:
  # Formatting and imports belong to ktlint - see `.editorconfig`.
  MaxLineLength:
    active: false
  WildcardImport:
    active: false
  NewLineAtEndOfFile:
    active: false
  TrailingWhitespace:
    active: false

  CanBeNonNullable:
    active: true
  DataClassContainsFunctions:
    active: false
  ExplicitCollectionElementAccessMethod:
    active: true
  ForbiddenComment:
    active: true
    comments:
      - reason: 'Ship-blocking markers must never reach a shared branch.'
        value: 'STOPSHIP:'
      - reason: 'Fix it or open an issue; FIXME rots in place.'
        value: 'FIXME:'
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'Console output is invisible on device. Use the shared logger.'
        value: 'kotlin.io.println'
      - reason: 'Console output is invisible on device. Use the shared logger.'
        value: 'kotlin.io.print'
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreConstantDeclaration: true
    ignoreAnnotation: true
    # An enum entry already names its own value. `Tight(1.2f)` says more than a
    # constant called TightLineSpacing would, and the entry is the only place the
    # number is written.
    ignoreEnums: true
    # Layout literals read better inline than hoisted into named constants; the
    # design system's tokens cover the values that genuinely need a name.
    ignoreAnnotated: ['Composable', 'Preview']
    # Spelled out rather than referencing `testSources`, because YAML has no way
    # to append to an aliased sequence and this one has an entry of its own.
    excludes:
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/iosTest/**'
      - '**/androidDeviceTest/**'
      - '**/src/test/**'
      - '**/formats-testing/**'
      - '**/*.kts'
      # The layer that decodes published formats and speaks protocols. A ZIP
      # central-directory record puts the name length at offset 28, a surrogate
      # pair starts at 0xD800, and 172.16/12 is a private range - each of those
      # numbers means what a specification says it means, is written in exactly
      # one place, and reads worse behind a name somebody invented for it. The
      # rule asks "what is this number", and here the answer is already beside
      # it. It still applies to domain, application and presentation, which is
      # where a number nobody can account for actually turns up.
      - '**/infrastructure/**'
  MandatoryBracesLoops:
    active: true
  MandatoryBracesIfStatements:
    active: true
  ReturnCount:
    active: true
    max: 3
    excludeGuardClauses: true
  ThrowsCount:
    active: true
    max: 2
  UnnecessaryLet:
    active: true
  # A fixture's sample text and a builder returning a fixed document are what a
  # test is made of, not constants waiting to be named.
  MayBeConst:
    active: true
    excludes: *testSources
  FunctionOnlyReturningConstant:
    active: true
    excludes: *testSources
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
    # A @Preview has no caller by design; the tooling is what invokes it.
    ignoreAnnotated: ['Preview']
  UseCheckOrError:
    active: true
  UseRequire:
    active: true
  VarCouldBeVal:
    active: true

# Compose-specific rules, supplied by the io.nlopez.compose.rules detekt plugin.
Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableParamOrder:
    active: true
  CompositionLocalAllowlist:
    active: true
    # The app's design system. Each of these answers a question about the window
    # or the device that every screen asks and no screen can answer for itself -
    # how wide it is, how short it is, how large a control has to be for whatever
    # is pointing at it, how the platform draws glass, how fast the reader wants
    # things to move. Passing any of them as a parameter would mean threading it
    # through every composable between the theme and the one that reads it.
    allowedCompositionLocals:
      - LocalLukiaDimens
      - LocalLukiaMetrics
      - LocalWindowWidthClass
      - LocalWindowHeightClass
      - LocalGlassStyle
      - LocalMotionStyle
  ContentEmitterReturningValues:
    active: true
  DefaultsVisibility:
    active: true
  ModifierClickableOrder:
    active: true
  ModifierComposable:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  MutableStateAutoboxing:
    active: true
  ParameterNaming:
    active: true
  PreviewAnnotationNaming:
    active: true
  PreviewPublic:
    active: true
  RememberMissing:
    active: true
  UnstableCollections:
    active: false
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
