// Types the Compose compiler cannot see are immutable, but which are.
//
// Every one of these is a read-only value built once and never written to again -
// a stored library entry, a book's metadata, a reading position. The compiler
// cannot tell: they hold a List or a ByteArray, both of which could in principle
// be mutated by whoever else has a reference, so it treats a composable taking
// one as never safe to skip. In a grid of book covers that means every card
// recomposes whenever anything anywhere changes.
//
// Listed here rather than annotated with @Immutable so that the domain layer does
// not have to import the Compose runtime to say something that is true of it
// regardless of who is drawing it.
//
// These are matched as plain strings, and nothing fails when one stops matching:
// a class moved to another package is simply no longer listed, and the screens
// built on it go back to recomposing wholesale with nothing on screen or in the
// build to say so. A rename that touches any package below has to be made here
// too - which is how the reader profile's types came to sit in this file for a
// while after the statistics screen replaced them.
io.lukia.core.domain.document.BookMetadata
io.lukia.core.domain.document.CoverImage
io.lukia.core.domain.document.DocumentInfo
io.lukia.core.domain.document.DocumentType
io.lukia.core.domain.document.PickedDocument
io.lukia.core.domain.reading.ReadingProgress
io.lukia.core.domain.reading.ReadingSession
io.lukia.features.stats.domain.DayReading
io.lukia.features.stats.domain.ReadingActivity
io.lukia.features.stats.domain.ReadingHabits
io.lukia.features.stats.domain.ReadingStats
io.lukia.features.stats.domain.ReadingSummary
